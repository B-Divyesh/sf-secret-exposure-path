[package]
name = "secret-exposure-path"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Trace secret propagation from local sources into command output, Git diffs, and artifacts"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-secret-exposure-path"
homepage = "https://secret-exposure-path.sociobot.in"
readme = "README.md"
keywords = ["secrets", "security", "ci", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", ".factory/", "dist/", "tests/fixtures/"]

[[bin]]
name = "sep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"
